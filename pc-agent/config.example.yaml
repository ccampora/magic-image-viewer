# Copy to config.yaml and adjust.
port: 8787

# Where received photos are saved. Leave unset (or comment it out) to use
# /dev/shm (RAM-backed tmpfs on Linux — photos never touch disk, and are gone
# on reboot), falling back to the OS temp dir if /dev/shm isn't available.
# Set an explicit path if you want them kept permanently instead:
# save_dir: "~/Pictures/FromPhone"

# Command used to open a newly received image. {file} is replaced with the
# absolute path. The agent kills the previous viewer process before running
# this, so a fullscreen-capable viewer effectively "replaces" the picture on
# screen instead of piling up windows.
#
# Linux:
#   viewer_command: "xdg-open {file}"        # OS default viewer (new window each time)
#   viewer_command: "imv -f {file}"          # imv, fullscreen (Wayland/X11) — recommended
#   viewer_command: "feh -F {file}"          # feh, fullscreen (X11)
#   viewer_command: "eog {file}"
#
# Windows:
#   viewer_command: "cmd /c start \"\" \"{file}\""   # OS default viewer, new window each time
#   viewer_command: "irfanview {file} /fs"            # IrfanView, fullscreen (if installed)
#
# macOS:
#   viewer_command: "open {file}"            # OS default viewer (Preview), new window each time
#   viewer_command: "open -a Preview {file}"  # force Preview specifically
#
# Pick the line for your OS and uncomment it; the fullscreen options need
# their respective viewer installed separately.
viewer_command: "xdg-open {file}"

# Name advertised over mDNS so the phone can auto-discover this agent.
service_name: "magic-image-viewer"
